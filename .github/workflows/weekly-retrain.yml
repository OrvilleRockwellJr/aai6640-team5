name: Retrain model (manual only)
# The app is pinned to the midterm model until the final version is added, so this no longer runs on a schedule.
# Run it by hand (Actions tab, Run workflow) when the team ships the final model.
on:
  workflow_dispatch:
concurrency:
  group: gaslab-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/update_daily.py
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
      - run: python -c "from gaslab import service; print(service.train())"
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
      - run: python tools/update_daily.py --offline
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
      - name: Commit changes
        run: |
          git config user.name "gaslab-bot"
          git config user.email "gaslab-bot@users.noreply.github.com"
          git add data docs model
          git diff --cached --quiet || git commit -m "Weekly retrain $(date -u +%F)"
          git pull --rebase -q
          git push

name: Daily GasLab update
# Fetches new FRED + AAA data, grades yesterday's forecast, freezes tomorrow's, and republishes the demo data.
on:
  schedule:
    - cron: "45 12 * * *"   # about 7:45 a.m. ET (8:45 during daylight time)
  workflow_dispatch:
concurrency:
  group: gaslab-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/update_daily.py
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
      - name: Commit changes
        run: |
          git config user.name "gaslab-bot"
          git config user.email "gaslab-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git pull --rebase -q
          git push
